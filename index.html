<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SehatNet</title>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0b7a6e">
<link rel="apple-touch-icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SehatNet">
<style>
:root{--g:#0b7a6e;--g2:#19b5a1;--bg:#eef4f3;--c:#fff;--t:#14312d;--m:#6a7f7c;--l:#e1ebe9;--r:#c0392b;--sh:0 4px 16px #0b3b3510}
@media(prefers-color-scheme:dark){:root{--bg:#0e1b1a;--c:#16282605;--t:#e6f2f0;--m:#8fa8a4;--l:#25403c}.card,.tile,input,select,textarea,#mdi,nav,.pc{background:#162826!important;color:var(--t)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);padding-bottom:150px}
header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #0b7a6e55}
header b{font-size:19px;letter-spacing:.3px}header small{font-weight:400;opacity:.8;font-size:11px}
#av{width:36px;height:36px;border-radius:50%;background:#fff3;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;border:2px solid #fff6}
main{padding:14px;max-width:680px;margin:auto;animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.card{background:var(--c);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,#0b7a6e,#19b5a1 70%,#5eead4);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px #0b7a6e44}
.hero .m{color:#d9fbf5}.warn{background:#fff4d6;color:#8a5a00}
input,select,textarea{width:100%;padding:12px;margin:4px 0 9px;border:1.5px solid var(--l);border-radius:12px;font:inherit;background:#fff;color:var(--t);outline:none}input:focus,textarea:focus,select:focus{border-color:var(--g2)}
button{background:var(--g);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}button:active{transform:scale(.96)}
button.s{background:var(--l);color:var(--t)}button.d{background:var(--r)}button.w{width:100%;padding:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom);z-index:6;overflow-x:auto;box-shadow:0 -4px 16px #0001}
nav button{flex:1;min-width:62px;background:none;color:var(--m);border-radius:0;padding:8px 2px 7px;font-size:11px;font-weight:500}nav button span{display:block;font-size:21px;transition:.2s}nav button.on{color:var(--g)}nav button.on span{transform:translateY(-3px) scale(1.15)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.big{font-size:22px;font-weight:800}.m{color:var(--m);font-size:13px}h3{margin:14px 2px 8px}
.tag{border-radius:20px;padding:3px 10px;font-size:12px;background:var(--l);font-weight:600}.tag.ok{background:#d3f7e6;color:#0a6b3d}.tag.wa{background:#ffefc7;color:#8a5a00}.tag.bad{background:#fde0dc;color:#a52a1d}
.tile{background:#fff;border-radius:16px;padding:12px 4px;text-align:center;box-shadow:var(--sh);font-size:12px;font-weight:600;cursor:pointer}.tile span{display:block;font-size:26px;margin-bottom:3px}
.chips{display:flex;gap:7px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}.chips button{white-space:nowrap;background:#fff;color:var(--t);border-radius:22px;box-shadow:var(--sh);padding:8px 14px}.chips button.on{background:var(--g);color:#fff}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pc{background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--sh);position:relative}
.pt{height:84px;display:flex;align-items:center;justify-content:center;font-size:44px}.pb{padding:10px}.pb b{font-size:14px;display:block;min-height:36px}
.off{position:absolute;top:8px;left:8px;background:var(--r);color:#fff;border-radius:8px;padding:2px 7px;font-size:11px;font-weight:700}
.qty{display:flex;align-items:center;justify-content:space-between;margin-top:6px}.qty button{padding:5px 13px;font-size:18px;border-radius:10px}
#cb{position:fixed;bottom:66px;left:12px;right:12px;background:linear-gradient(135deg,#0f2b28,#16403b);color:#fff;border-radius:16px;padding:12px 16px;display:none;justify-content:space-between;align-items:center;z-index:6;box-shadow:0 8px 24px #0006}
#md{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:9}#md>div{background:#fff;width:100%;max-width:680px;margin:auto;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px;animation:f .2s}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#14312d;color:#fff;padding:10px 18px;border-radius:24px;display:none;z-index:99;max-width:90%;box-shadow:0 6px 20px #0005}
.bar{height:10px;background:#ffffff40;border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .8s}
.badge{display:inline-block;background:#fff3;border-radius:20px;padding:3px 12px;font-weight:700;font-size:13px}
.steps{display:flex;align-items:center;margin:10px 0 2px}.steps i{width:12px;height:12px;border-radius:50%;background:var(--l)}.steps i.on{background:var(--g2)}.steps u{flex:1;height:3px;background:var(--l)}.steps u.on{background:var(--g2)}
.ind{border-left:3px solid var(--g2)}.empty{text-align:center;color:var(--m);padding:30px 10px}.empty span{font-size:42px;display:block}
.bars{display:flex;align-items:flex-end;gap:4px;height:100px}.bars div{flex:1;background:linear-gradient(var(--g2),var(--g));border-radius:5px 5px 0 0;min-height:3px}
.rt{width:100%;border-collapse:collapse;font-size:13px}.rt th{background:var(--l);padding:7px;text-align:left;white-space:nowrap}.rt td{padding:7px;border-bottom:1px solid var(--l)}.rt td.n{text-align:right}.rt td.bad{color:var(--r);font-weight:700}
#bell{position:relative;font-size:21px;margin-right:14px;cursor:pointer;display:none}#bc{position:absolute;top:-6px;right:-9px;background:#ef4444;color:#fff;border-radius:10px;font:700 10px/1 sans-serif;padding:3px 5px;font-style:normal;display:none}
@media print{header,nav,#cb,button,.chips,#md{display:none!important}body{padding:0}}
.pr{margin:2px 0}.g2c{color:var(--g)}.save{display:inline-block;background:#fff1e0;color:#d9480f;font-weight:700;font-size:12px;border-radius:6px;padding:2px 7px;margin:2px 0}
.promo{background:linear-gradient(135deg,#ff7a18,#ff3d6e);color:#fff;border-radius:20px;padding:18px;margin-bottom:12px;position:relative;box-shadow:0 8px 22px #ff3d6e40}.promo .big{font-size:24px;max-width:70%}
.pill2{position:absolute;right:12px;top:12px;background:#fff;color:#d9480f;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}
.cats{display:flex;gap:10px;overflow-x:auto;margin-bottom:6px;padding-bottom:4px}.cat{min-width:78px;text-align:center;font-size:12px;font-weight:600;background:#fff;border-radius:16px;padding:10px 6px;box-shadow:var(--sh);cursor:pointer}.cat span{display:block;font-size:28px}.cat.on{background:var(--g);color:#fff}
.hrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}.login-strip{background:#fff3cd;color:#7a5a00;border-radius:12px;padding:10px 14px;margin-bottom:10px;font-weight:600;cursor:pointer}
.bar2{height:10px;background:var(--l);border-radius:8px;overflow:hidden;margin:8px 0}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g));border-radius:8px}
.center{text-align:center;margin-bottom:14px}.pill{display:inline-block;background:#fff;border-radius:26px;padding:10px 28px;font-size:22px;font-weight:800;color:#5b3fd1;box-shadow:var(--sh)}
.big4{grid-template-columns:repeat(4,1fr)}@media(max-width:600px){.big4{grid-template-columns:repeat(2,1fr)}}
.st{background:#fff;border-radius:16px;padding:16px 8px;text-align:center;box-shadow:var(--sh)}.st .ic{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:22px}.st b{font-size:26px;display:block}.st small{color:var(--m)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 8px;font-size:17px}.sec.red{color:#c0392b}
.tblc{background:#fff;border-radius:14px;overflow-x:auto;box-shadow:var(--sh);border-left:4px solid #e74c3c}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.boxes{grid-template-columns:1fr}}
.box{border-radius:14px;overflow:hidden;border:1.5px solid}.box h4{margin:0;padding:12px 14px;font-size:16px}.box .r{display:flex;justify-content:space-between;padding:10px 14px;background:#fff;border-top:1px solid #0001;font-size:14px}
.b1{border-color:#f5b17a}.b1 h4{background:#fff4ea;color:#b45309}.b2{border-color:#64d3c4}.b2 h4{background:#e7faf7;color:#0b7a6e}.b3{border-color:#b9a3f0}.b3 h4{background:#f3eeff;color:#5b3fd1}.b4{border-color:#f2d36b}.b4 h4{background:#fff9e0;color:#8a6d00}
@media(min-width:900px){body.adm nav{top:58px;bottom:0;right:auto;width:225px;flex-direction:column;overflow-y:auto;border-top:0;border-right:1px solid var(--l);box-shadow:none;padding:10px 8px}
body.adm nav button{display:flex;align-items:center;gap:10px;text-align:left;font-size:14px;padding:11px 12px;border-radius:10px;min-width:0;flex:none;margin-bottom:2px}body.adm nav button span{font-size:18px;display:inline;transform:none!important}body.adm nav button.on{background:#e8f6f4}
body.adm main{margin-left:225px;max-width:none;padding:22px 30px}body.adm{padding-bottom:20px}body.adm #md>div{max-width:620px}}
</style></head><body>
<div id="toast"></div>
<header><b>🌿 SehatNet <small>v5</small></b><div style="display:flex;align-items:center"><a id="invlink" href="/inventory" style="display:none;color:var(--g);font-weight:700;margin-right:14px;text-decoration:none;font-size:14px">🧾 Inventory</a><div id="bell" onclick="notifs()">🔔<i id="bc"></i></div><div id="av" onclick="profile()" style="display:none"></div></div></header>
<main id="app"></main>
<div id="cb"><span id="cbt"></span><button onclick="checkout()" style="background:#19b5a1">Checkout →</button></div>
<nav id="nav"></nav><div id="md" onclick="if(event.target.id=='md')closeM()"><div id="mdi"></div></div>
<script>
let tok=localStorage.tok||"",adm=sessionStorage.adm||"",me=null,tab="home",at="dash",cart={},cat=[],q="",cf="all",amode="login",cfg={},lastN=-1;
const $=s=>document.querySelector(s),v=id=>document.getElementById(id).value,rs=n=>"₹"+(+n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const cls=s=>({delivered:"ok",approved:"ok",paid:"ok",awaiting_payment:"wa",requested:"wa",pending:"wa",returned:"bad",reversed:"bad",rejected:"bad",cancelled:"bad"})[s]||"";
const lbl={awaiting_payment:"Payment baaki",paid:"Paid",delivered:"Delivered",returned:"Return",cancelled:"Cancel",requested:"Requested",approved:"Approved",pending:"Pending",rejected:"Rejected",reversed:"Wapas"};
const tag=s=>`<span class="tag ${cls(s)}">${lbl[s]||s}</span>`;
const PT={medicine:["💊","#dff3ff"],general:["🧴","#fff1cf"]},pt=c=>PT[c]||["📦","#ece6ff"];
const when=t=>new Date(t*1000).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const empty=(e,t)=>`<div class="empty"><span>${e}</span>${t}</div>`;
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",3200)}
async function api(m,p,b){const h={"Content-Type":"application/json"};if(tok)h["X-Token"]=tok;if(adm)h["X-Admin-Token"]=adm;
 const r=await fetch(p,{method:m,headers:h,body:m=="GET"?undefined:JSON.stringify(b||{})});const j=await r.json();
 if(!r.ok){if(r.status==401&&tok&&p!="/login")logout();toast(j.error||"Error");throw j}return j}
const go=async f=>{try{await f()}catch(e){}};
const openM=h=>{$("#mdi").innerHTML=h;$("#md").style.display="flex"},closeM=()=>$("#md").style.display="none";
const load=async()=>cat=await fetch("/catalog").then(r=>r.json());
async function boot(){if(tok&&!adm){try{me=await api("GET","/me")}catch(e){tok="";localStorage.tok="";me=null}}if(me&&me.role=="staff"){location.href="/inventory";return}await load();render()}
function logout(){tok="";adm="";localStorage.tok="";sessionStorage.adm="";me=null;cart={};tab="home";closeM();render()}
function render(){const a=$("#av");a.style.display=adm||me?"flex":"none";a.textContent=adm?"⚙️":me?me.name[0].toUpperCase():"";$("#cb").style.display="none";
 $("#bell").style.display=me&&!adm?"block":"none";$("#invlink").style.display=adm?"inline":"none";if(me&&!adm){poll();offerPopup()}document.body.classList.toggle("adm",!!adm);if(adm)return adminShell();if(me)return userShell();guestShell()}

/* AUTH */
function authView(){guestNav();const ref=new URLSearchParams(location.search).get("ref")||"";if(ref)amode=amode=="login"&&!authView.s?"register":amode;authView.s=1;
 const tabs=["login","register","admin"].map(x=>`<button class="${amode==x?"on":""}" onclick="amode='${x}';authView()">${{login:"🔑 Login",register:"✨ Naya account",admin:"⚙️ Admin"}[x]}</button>`).join("");
 const f={login:`<input id="lp" placeholder="Phone number" inputmode="numeric"><input id="lk" type="password" placeholder="PIN"><button class="w" onclick="doLogin()">Login karein</button>`,
 register:`<div class="m">Koi deposit ya joining fee nahi. Admin KYC dekhkar ID active karega.</div><br><input id="rn" placeholder="Poora naam"><input id="rp" placeholder="Phone number" inputmode="numeric"><input id="rk" placeholder="PAN / Aadhaar number"><input id="rk2" type="password" placeholder="PIN banayein (4+ digit)"><input id="rs" placeholder="Sponsor code" inputmode="numeric" value="${ref}"><textarea id="ra" placeholder="Pata"></textarea><label class="m" style="display:flex;gap:8px;align-items:center"><input id="rw" type="checkbox" style="width:auto" checked> WhatsApp par updates chahiye</label><br><button class="w" onclick="doReg()">Account banayein</button>`,
 admin:`<input id="at" type="password" placeholder="Admin token"><button class="w" onclick="doAdmin()">Admin login</button>`}[amode];
 $("#app").innerHTML=`<div class="hero" style="text-align:center"><div style="font-size:46px">🌿</div><div class="big">SehatNet</div><div class="m">Sasta saman, ghar baithe kamai</div></div><div class="chips">${tabs}</div><div class="card">${f}</div>`}
const doLogin=()=>go(async()=>{tok=(await api("POST","/login",{phone:v("lp"),pin:v("lk")})).token;localStorage.tok=tok;await boot()});
const doReg=()=>go(async()=>{const r=await api("POST","/register",{name:v("rn"),phone:v("rp"),kyc_id:v("rk"),pin:v("rk2"),sponsor_id:+v("rs")||null,address:v("ra"),wa_optin:$("#rw").checked});toast("Account ban gaya! ID "+r.user_id+". Ab login karein.");amode="login";authView()});
const doAdmin=()=>go(async()=>{adm=v("at");sessionStorage.adm=adm;try{await api("GET","/admin/stats")}catch(e){adm="";sessionStorage.adm="";throw e}at="dash";render()});

/* USER */
const ut=()=>{const t=[["home","🏠","Home"],["shop","🛍️","Shop"],["orders","📦","Orders"],["team","👥","Team"],["wallet","💰","Wallet"]];if(me&&me.role!="customer")t.push(["stock","📒","Stock"]);return t};
function nav(tabs,cur,fn){$("#nav").innerHTML=tabs.map(x=>`<button class="${x[0]==cur?"on":""}" onclick="${fn}('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("")}
const setTab=t=>{tab=t;userShell()};
function userShell(){nav(ut(),tab,"setTab");({home:vHome,shop:vShop,orders:vOrders,team:vTeam,wallet:vWallet,stock:vStock})[tab]();cartBar()}
const cn=()=>Object.values(cart).reduce((a,b)=>a+b,0),ctot=()=>cat.reduce((a,p)=>a+(cart[p.id]||0)*p.mrp*(1-p.discount_pct/100),0);
function cartBar(){const sv=cat.reduce((a,p)=>a+(cart[p.id]||0)*p.mrp*p.discount_pct/100,0);$("#cb").style.display=cn()&&(me?tab=="shop":!adm&&gtab=="shop")?"flex":"none";$("#cbt").innerHTML=`🛒 ${cn()} item · <b>${rs(ctot())}</b>${sv>0?`<div style="font-size:11px;color:#7ef0d3">Aap bachayenge ${rs(sv)} 🎉</div>`:""}`}
function share(){const u=location.origin+"/?ref="+me.id,t="SehatNet par sasta saman! Mera sponsor code: "+me.id;navigator.share?navigator.share({title:"SehatNet",text:t,url:u}).catch(()=>{}):navigator.clipboard.writeText(t+" "+u).then(()=>toast("Link copy ho gaya"))}
const steps=s=>{const n={awaiting_payment:0,paid:1,delivered:2}[s];if(n===undefined)return"";return`<div class="steps"><i class="on"></i><u class="${n>=1?"on":""}"></u><i class="${n>=1?"on":""}"></i><u class="${n>=2?"on":""}"></u><i class="${n>=2?"on":""}"></i></div><div class="row m"><span>Order</span><span>Paid</span><span>Delivered</span></div>`};

const nfmt=n=>(+n).toLocaleString("en-IN");
const ladder=S=>`<div class="m" style="margin-bottom:8px">Level n: ${S.mult}ⁿ ID (har ID ${rs(S.base)} ka saman) ya utna business. Jo pehle ho, wahi level complete.</div>`+S.levels.map(x=>`<div class="card"><div class="row"><b>Level ${x.level}</b>${x.done?'<span class="tag ok">✅ Complete</span>':`<span class="tag wa">${x.pct}%</span>`}</div><div class="bar2"><i style="width:${x.pct}%"></i></div>
<div class="m">👥 ID lagi: <b>${nfmt(x.qualified)}</b> / ${nfmt(x.target_people)} &nbsp;·&nbsp; 💼 Business: <b>${rs(x.volume)}</b> / ${rs(x.target_volume)}</div>${x.done?"":`<div class="m">Baaki: ${nfmt(Math.max(0,x.target_people-x.qualified))} ID ya ${rs(Math.max(0,x.target_volume-x.volume))} ka saman</div>`}</div>`).join("");
const sc=(l,x)=>`<div class="card"><div class="m">${l}</div><div class="big" style="font-size:19px">${x}</div></div>`;
async function vHome(){const[w,t,os,ofs]=await Promise.all([api("GET","/wallet/"+me.id),api("GET","/my/team"),api("GET","/my/orders"),fetch("/offers").then(r=>r.json())]);const nx=t.levels.find(x=>!x.done);
 $("#app").innerHTML=(me.active?"":`<div class="card warn">⏳ <b>ID verify ho rahi hai.</b> Profile mein KYC photo daalein; admin approve karega tab order kar payenge.</div>`)+
 `<div class="hero"><div class="row"><div><div class="m">Namaste 👋</div><div class="big">${me.name}</div></div><span class="badge">🏅 ${t.rank_name}</span></div>
 <div class="bar"><i style="width:${nx?nx.pct:100}%"></i></div><div class="m">${nx?`Level ${nx.level}: ${nfmt(nx.qualified)}/${nfmt(nx.target_people)} ID · baaki ${nfmt(Math.max(0,nx.target_people-nx.qualified))} ID ya ${rs(Math.max(0,nx.target_volume-nx.volume))} ka saman`:"Sabhi levels complete 🎉"} · Code <b>${me.id}</b></div></div>
 ${offerHtml(ofs)}<div class="g4"><div class="tile" onclick="setTab('shop')"><span>🛍️</span>Shop</div><div class="tile" onclick="setTab('orders')"><span>📦</span>Orders</div><div class="tile" onclick="share()"><span>📤</span>Invite</div><div class="tile" onclick="setTab('team')"><span>👥</span>Team</div></div>
 <div class="g4"><div class="tile" onclick="support()"><span>💬</span>Support</div><div class="tile" onclick="setTab('wallet')"><span>💰</span>Wallet</div><div class="tile" onclick="notifs()"><span>🔔</span>Alerts</div>${me.role!="customer"?`<div class="tile" onclick="setTab('stock')"><span>📒</span>Stock</div>`:`<div class="tile" onclick="profile()"><span>👤</span>Profile</div>`}</div>
 <h3>📈 Mera kaam</h3><div class="g">${sc("Nikalne layak",rs(w.available))}${sc("Saman credit",rs(w.goods_credit))}${sc("Direct ID",t.direct)}${sc("Poori team",t.team)}${sc("Team ki pehli khareed",rs(t.first_biz))}${sc("Team ka repurchase",rs(t.repeat_biz))}</div>
 <h3>Recent orders</h3>`+(os.slice(0,3).map(o=>`<div class="card"><div class="row"><b>#${o.id} · ${rs(o.total)}</b>${tag(o.status)}</div>${steps(o.status)}</div>`).join("")||empty("🛒","Abhi koi order nahi. Shop se shuru karein!"))}

const qb=(p,n)=>n?`<button class="s" onclick="qt(${p.id},-1)">−</button><b>${n}</b><button onclick="qt(${p.id},1)">+</button>`:`<button class="w" onclick="qt(${p.id},1)">+ Add</button>`;
